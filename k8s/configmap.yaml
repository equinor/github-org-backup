apiVersion: v1
kind: ConfigMap
metadata:
  name: github-backup-config
  namespace: github-backup
data:
  # GitHub organisation to back up
  GITHUB_ORG: "my-org"

  # Azure Key Vault — used by the script to fetch the GitHub PAT at startup
  AZURE_KEYVAULT_URL: "https://my-vault.vault.azure.net"
  GITHUB_TOKEN_SECRET_NAME: "github-pat"

  # Azure Blob Storage — the Managed Identity must have
  # "Storage Blob Data Contributor" on this account (or the container)
  AZURE_STORAGE_ACCOUNT: "mystorageaccount"
  AZURE_CONTAINER_NAME: "github-backups"

  # Parallel clone/compress/upload workers.
  # Peak disk usage ≈ BACKUP_CONCURRENCY × avg_compressed_repo_size.
  BACKUP_CONCURRENCY: "20"

  # Set to "true" to do a dry run (no uploads, no deletions).
  DRY_RUN: "false"

  # Mount path of the emptyDir volume declared in the CronJob spec.
  WORK_DIR: "/tmp/backup-work"
