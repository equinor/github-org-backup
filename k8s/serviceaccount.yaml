apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-backup-sa
  namespace: github-backup
  annotations:
    # Client ID of the Azure Managed Identity federated to this ServiceAccount.
    # Create the federated credential with:
    #   az identity federated-credential create \
    #     --name github-backup-federated \
    #     --identity-resource-id <MANAGED_IDENTITY_RESOURCE_ID> \
    #     --issuer <AKS_OIDC_ISSUER_URL> \
    #     --subject system:serviceaccount:github-backup:github-backup-sa
    azure.workload.identity/client-id: "<MANAGED_IDENTITY_CLIENT_ID>"
  labels:
    azure.workload.identity/use: "true"
